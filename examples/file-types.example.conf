# Example: file-butler File Types Configuration
# Copy to config/file-types.conf and customize for your needs

# Basic file types
Documents=pdf,doc,docx,txt,xlsx,csv,pptx,pages,numbers,keynote,odt,rtf
Images=jpg,jpeg,png,gif,svg,webp,bmp,ico,heic,tiff,raw,eps
Videos=mp4,mov,avi,mkv,flv,wmv,webm,m4v,mpg,mpeg,3gp,ogv
Audio=mp3,wav,aac,flac,m4a,wma,ogg,opus,alac,aiff
Code=js,ts,jsx,tsx,py,java,go,rs,cpp,c,h,swift,kt,rb,php,css,html,json,xml,yaml,yml,sh,bash,pl
Archives=zip,tar,gz,rar,7z,bz2,xz,iso,dmg,pkg
Design=figma,sketch,xd,psd,ai,indd,fig
Executables=exe,dmg,pkg,app,bin,sh,bash,py,jar

# Custom categories (add your own)
Projects=project,workspace,workspace.json
Screenshots=screenshot,png,jpg
Downloads=dmg,exe,pkg,zip
