# file-butler File Types Configuration
# Format: TYPE_NAME=extension1,extension2,extension3
# Lines starting with # are comments

Documents=pdf,doc,docx,txt,xlsx,csv,pptx,pages,numbers,keynote
Images=jpg,jpeg,png,gif,svg,webp,bmp,ico,heic,tiff
Videos=mp4,mov,avi,mkv,flv,wmv,webm,m4v,mpg,mpeg
Audio=mp3,wav,aac,flac,m4a,wma,ogg,opus,alac
Code=js,ts,jsx,tsx,py,java,go,rs,cpp,c,h,swift,kt,rb,php,css,html,json,xml,yaml,yml,sh,bash
Archives=zip,tar,gz,rar,7z,bz2,xz,iso
Compressed=zip,gz,rar,7z,bz2
Executables=exe,dmg,pkg,app,bin,sh,bash
Design=figma,sketch,xd,psd,ai,indd
